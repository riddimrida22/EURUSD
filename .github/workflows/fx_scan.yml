name: FX Signal Scan

on:
  schedule:
    # Every hour at :05, Sunday 21:00 UTC through Friday 21:00 UTC (FX market hours)
    - cron: '5 * * * 1-5'
    - cron: '5 21-23 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write  # the paper bot commits its ledger back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      # Persist the alert-dedup state across runs (restore-keys picks the
      # most recent previous run's state; each run saves under a fresh key)
      - uses: actions/cache@v5
        with:
          path: |
            alert_state.json
            paper_state.json
          key: fx-alert-state-${{ github.run_id }}
          restore-keys: |
            fx-alert-state-

      - name: Run scanner
        env:
          # Optional override; scanner.py has a built-in default topic
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Optional: live FX candles (OANDA) and live equity bars (Webull)
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
          WEBULL_APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
        run: python scanner.py

      - name: Paper bot (simulated fills only)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
          WEBULL_APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
        run: python paper_bot.py

      # Publish the ledger so the deployed dashboard's Positions tab shows it
      - name: Commit paper ledger
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add paper_state.json
          git diff --cached --quiet || (git commit -m "paper-bot: ledger update" && git push)
